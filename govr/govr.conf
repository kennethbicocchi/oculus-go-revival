# GoVR settings (read by scripts/go-start). Edit freely.

# PC monitor to show in desktop mode (list: build/kwin-capture/govr-kwin-capture --list)
OUTPUT=DP-3
# Or a virtual monitor just for the headset, e.g. VIRTUAL=1920x1080 (empty = mirror OUTPUT)
VIRTUAL=
# Audio: "all" = every PC sound goes to the headset while streaming (restored at exit)
#        "choose" = only apps you move to the "GoVR-Headset" device in the volume applet
AUDIO=all
# Mute the PC speakers while streaming (yes/no)
MUTE_PC=no
# Video bitrate for desktop mode, kbit/s
BITRATE=20000
# Keep the headset awake even when nobody wears it (testing only: drains the battery,
# because a USB 2.0 port cannot power the Go with the display on)
KEEP_AWAKE=no
